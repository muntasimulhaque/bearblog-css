<button id="theme-toggle" type="button" aria-label="Switch to dark mode"><!--
  Two inline SVGs (Feather icons, MIT): moon for light mode, sun for dark mode.
  CSS shows the right one based on data-theme — no JS icon swapping needed.
  --><svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>

<script>
(function() {
  // Mark JS as available so the CSS can reveal the toggle (no dead button without JS)
  document.documentElement.classList.add('js');

  var isDark = localStorage.getItem('theme') === 'dark';

  // Prevent flash of light theme on load
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    // Accurate label from the start; the icons themselves are swapped by CSS
    toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');

    toggle.addEventListener('click', function() {
      var currentlyDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (currentlyDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.removeItem('theme');
        toggle.setAttribute('aria-label', 'Switch to dark mode');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        toggle.setAttribute('aria-label', 'Switch to light mode');
      }
    });
  }
})();
</script>
