<button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>

<script>
(function() {
  // Mark JS as available so the CSS can reveal the toggle (no dead button without JS)
  document.documentElement.classList.add('js');

  var isDark = localStorage.getItem('theme') === 'dark';

  // Prevent flash of light theme on load
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  
  // Set correct emoji immediately
  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.textContent = isDark ? '☀️' : '🌙';
  }
  
  // Handle clicks
  if (toggle) {
    toggle.addEventListener('click', function(e) {
      e.preventDefault();
      var currentlyDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (currentlyDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.removeItem('theme');
        toggle.textContent = '🌙';
        toggle.setAttribute('aria-label', 'Switch to dark mode');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        toggle.textContent = '☀️';
        toggle.setAttribute('aria-label', 'Switch to light mode');
      }
    });
  }
})();
</script>
